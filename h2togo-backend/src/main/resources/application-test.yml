# Perfil de pruebas.
# Los tests de integración (desde F1) levantan PostgreSQL+PostGIS con Testcontainers
# y sobrescriben el datasource dinámicamente (@ServiceConnection / @DynamicPropertySource).
# En F0 las pruebas son slices web (@WebMvcTest) que no tocan la BD.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# En pruebas no se precarga el grafo OSM (~5.4 MB) al arrancar cada contexto;
# se carga lazy solo cuando un test pide una ruta (RutaFlowIT).
h2togo:
  routing:
    precargar: false
  scheduling:
    # En pruebas los jobs no se disparan solos; se invocan manualmente (deterministas).
    enabled: false
