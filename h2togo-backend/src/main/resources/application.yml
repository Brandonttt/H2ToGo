# Configuración base del backend H2ToGo.
# El esquema v6 manda: Hibernate SOLO valida (ddl-auto: validate), nunca genera DDL.
spring:
  application:
    name: h2togo-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/h2togo_v6}
    username: ${DB_USER:h2togo}
    password: ${DB_PASSWORD:h2togo}
  # RabbitMQ: solo se usa con h2togo.mensajeria.habilitada=true (ver más abajo).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Reintentos de entrega con espera exponencial (1 s, 2 s, 4 s); agotados, el mensaje se
        # rechaza sin reencolar y RabbitMQ lo manda a la DLQ (h2togo.notificaciones.dlq).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Los tipos ENUM nativos de PostgreSQL se mapean en F1 con
        # @JdbcTypeCode(SqlTypes.NAMED_ENUM); ninguna entidad todavía en F0.
        format_sql: true

server:
  port: ${PORT:8080}

# springdoc / Swagger UI en /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Orígenes permitidos por CORS (panel web de administración).
# Sobrescribir en despliegue con H2TOGO_CORS_ALLOWED_ORIGINS.
h2togo:
  mensajeria:
    # true: las notificaciones viajan por RabbitMQ (producción). false: entrega directa en el
    # mismo proceso, sin broker (desarrollo local y pruebas).
    habilitada: ${H2TOGO_MENSAJERIA_HABILITADA:false}
  fcm:
    # JSON completo de la cuenta de servicio de Firebase. Vacío = FCM apagado (solo WebSocket).
    credenciales-json: ${FCM_CREDENCIALES_JSON:}
  cors:
    allowed-origins: ${H2TOGO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    # Sesión: token opaco. Expiración por INACTIVIDAD (RNF-004, §10 #15):
    # el filtro extiende a token-dias cuando quedan menos de token-refresco-dias.
    token-dias: 30
    token-refresco-dias: 7
    # OTP de verificación de teléfono (RN-002, §10 #17).
    otp-longitud: 6
    otp-vigencia-minutos: 10
  pedidos:
    # Suspensión por ausencias (RN-006, §10 #1): umbral y duración.
    ausencias-umbral: 2
    suspension-dias: 3
    # Radio de entrega (RF-014/RN-011): el repartidor debe estar a ≤ este radio.
    entrega-radio-m: 50
    # Radio de aviso de proximidad al cliente (RF-005/RN-010).
    proximidad-radio-m: 500
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:AC_AQUI_TU_SID}
    auth-token: ${TWILIO_AUTH_TOKEN:AQUI_TU_TOKEN}
    from-number: ${TWILIO_FROM_NUMBER:+1234567890}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:VAf49c305047af03c695f90bcf94e6a209}

logging:
  level:
    org.hibernate.SQL: info
