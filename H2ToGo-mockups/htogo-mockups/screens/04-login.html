<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>HToGo · 04 Inicio de sesión</title>
<meta name="viewport" content="width=460" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root{
    --primary:#0077B6; --primary-light:#00B4D8; --primary-dark:#03045E;
    --primary-soft:#CAF0F8; --primary-wash:#E0F7FF;
    --bg:#F8FAFC; --surface:#FFFFFF;
    --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8;
    --outline:#E2E8F0;
    --s-pendiente:#94A3B8; --s-asignado:#F59E0B;
    --s-encamino:#0077B6; --s-entregado:#10B981; --s-cancelado:#EF4444;
    --accent-emerald:#10B981; --accent-amber:#F59E0B;
    --accent-rose:#EF4444; --accent-purple:#8B5CF6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b1220;font-family:'Roboto',sans-serif;color:var(--text);}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}

  /* Frame Android 412x868 */
  .device{
    width:412px;height:868px;background:#0f172a;border-radius:46px;
    padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 2px #1e293b;
    position:relative;
  }
  .screen{
    width:100%;height:100%;border-radius:36px;overflow:hidden;
    background:var(--bg);position:relative;display:flex;flex-direction:column;
  }
  .status{
    height:32px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:13px;font-weight:600;color:var(--text);
    flex:0 0 auto;
  }
  .status .right{display:flex;gap:6px;align-items:center;}
  .status .material-icons{font-size:14px;}
  .nav-pill{
    position:absolute;left:50%;transform:translateX(-50%);bottom:8px;
    width:120px;height:5px;border-radius:3px;background:#0f172a;opacity:.4;z-index:30;
  }

  /* Login layout */
  .login-bg{
    flex:1;display:flex;flex-direction:column;align-items:center;
    padding:32px 24px;
    background:linear-gradient(180deg,var(--primary-soft) 0%,var(--bg) 60%);
  }
  .logo-circle{
    width:72px;height:72px;border-radius:50%;background:var(--primary);
    display:flex;align-items:center;justify-content:center;margin-top:24px;
    box-shadow:0 10px 26px rgba(0,119,182,.3);
  }
  .logo-circle .material-icons{color:#fff;font-size:36px;}
  .title{
    margin:16px 0 4px;font-size:26px;font-weight:700;color:var(--text);
    text-align:center;
  }
  .subtitle{
    margin:0;font-size:15px;color:var(--text-2);text-align:center;
  }

  .form{width:100%;margin-top:32px;}
  .field{display:block;margin-bottom:12px;}
  .field-label{
    display:block;font-size:12px;color:var(--text-2);
    margin-bottom:6px;font-weight:500;
  }
  .field-box{
    display:flex;align-items:center;gap:10px;height:56px;
    border:1.5px solid var(--outline);border-radius:14px;background:#fff;
    padding:0 14px;
  }
  .field-box:focus-within{border-color:var(--primary);}
  .field-icon{color:var(--text-2);font-size:20px;}
  .field-box input{
    flex:1;border:0;outline:0;background:transparent;
    font:400 15px 'Roboto',sans-serif;color:var(--text);
  }
  .eye-btn{
    border:0;background:transparent;color:var(--text-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .eye-btn .material-icons{font-size:20px;}

  .row-remember{
    display:flex;align-items:center;margin:8px 0 16px;
  }
  .checkbox{
    width:20px;height:20px;border-radius:4px;border:2px solid var(--primary);
    background:var(--primary);display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .checkbox .material-icons{color:#fff;font-size:14px;}
  .row-remember .lbl{
    margin-left:8px;font-size:13px;color:var(--text-2);
  }
  .forgot{
    margin-left:auto;border:0;background:transparent;cursor:pointer;
    color:var(--primary);font:600 13px 'Roboto',sans-serif;
  }

  .btn-primary{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;height:56px;border-radius:28px;border:0;cursor:pointer;
    background:var(--primary);color:#fff;font:600 14px/1 'Roboto',sans-serif;
    letter-spacing:.2px;box-shadow:0 6px 16px rgba(0,119,182,.3);
  }

  .signup-row{
    margin-top:auto;display:flex;align-items:center;justify-content:center;
    gap:6px;padding:12px 0;
  }
  .signup-row span{font-size:13px;color:var(--text-2);}
  .signup-row button{
    border:0;background:transparent;cursor:pointer;
    color:var(--primary);font:600 13px 'Roboto',sans-serif;
  }
</style>
</head>
<body>
  <div class="device">
    <div class="screen">
      <!-- Status bar -->
      <div class="status">
        <span>9:41</span>
        <span class="right">
          <span class="material-icons">network_cell</span>
          <span class="material-icons">wifi</span>
          <span class="material-icons">battery_full</span>
        </span>
      </div>

      <!-- Contenido -->
      <div class="login-bg">
        <div class="logo-circle">
          <span class="material-icons">water_drop</span>
        </div>
        <h1 class="title">Bienvenido de vuelta</h1>
        <p class="subtitle">Inicia sesión para continuar</p>

        <div class="form">
          <label class="field">
            <span class="field-label">Correo electrónico</span>
            <span class="field-box">
              <span class="material-icons field-icon">alternate_email</span>
              <input type="email" value="gael@correo.com" />
            </span>
          </label>

          <label class="field">
            <span class="field-label">Contraseña</span>
            <span class="field-box">
              <span class="material-icons field-icon">lock</span>
              <input type="password" value="••••••••" />
              <button class="eye-btn" aria-label="Mostrar contraseña">
                <span class="material-icons">visibility_off</span>
              </button>
            </span>
          </label>

          <div class="row-remember">
            <span class="checkbox"><span class="material-icons">check</span></span>
            <span class="lbl">Recordarme</span>
            <button class="forgot">¿Olvidaste tu contraseña?</button>
          </div>

          <button class="btn-primary">Iniciar sesión</button>
        </div>

        <div class="signup-row">
          <span>¿Aún no tienes cuenta?</span>
          <button>Regístrate</button>
        </div>
      </div>

    </div>
    <div class="nav-pill"></div>
  </div>
</body>
</html>
