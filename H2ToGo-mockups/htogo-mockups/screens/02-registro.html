<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>HToGo · 02 Registro</title>
<meta name="viewport" content="width=460" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root{
    --primary:#0077B6; --primary-light:#00B4D8; --primary-dark:#03045E;
    --primary-soft:#CAF0F8; --primary-wash:#E0F7FF;
    --bg:#F8FAFC; --surface:#FFFFFF;
    --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8;
    --outline:#E2E8F0;
    --s-pendiente:#94A3B8; --s-asignado:#F59E0B;
    --s-encamino:#0077B6; --s-entregado:#10B981; --s-cancelado:#EF4444;
    --accent-emerald:#10B981; --accent-amber:#F59E0B;
    --accent-rose:#EF4444; --accent-purple:#8B5CF6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0b1220;font-family:'Roboto',sans-serif;color:var(--text);}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}

  /* Frame Android 412x868 */
  .device{
    width:412px;height:868px;background:#0f172a;border-radius:46px;
    padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 2px #1e293b;
    position:relative;
  }
  .screen{
    width:100%;height:100%;border-radius:36px;overflow:hidden;
    background:var(--bg);position:relative;display:flex;flex-direction:column;
  }
  .status{
    height:32px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:13px;font-weight:600;color:var(--text);
    flex:0 0 auto;
  }
  .status .right{display:flex;gap:6px;align-items:center;}
  .status .material-icons{font-size:14px;}
  .nav-pill{
    position:absolute;left:50%;transform:translateX(-50%);bottom:8px;
    width:120px;height:5px;border-radius:3px;background:#0f172a;opacity:.4;z-index:30;
  }

  /* Top bar simple */
  .topbar{
    height:56px;display:flex;align-items:center;padding:0 8px;
    background:var(--bg);flex:0 0 auto;
  }
  .topbar .icon-btn{
    width:40px;height:40px;border-radius:50%;border:0;background:transparent;
    color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }

  /* Scroll container */
  .scroll{
    flex:1;overflow:auto;padding:8px 24px 16px;
  }

  /* Header con logo */
  .reg-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .reg-head .avatar{
    width:44px;height:44px;border-radius:50%;background:var(--primary);
    display:flex;align-items:center;justify-content:center;
  }
  .reg-head .avatar .material-icons{color:#fff;font-size:22px;}
  .reg-head h1{margin:0;font-size:24px;font-weight:600;color:var(--text);}
  .reg-head .sub{font-size:14px;color:var(--text-2);margin-top:2px;}

  /* Selector rol */
  .section-label{
    font-size:11px;font-weight:600;color:var(--text-2);
    letter-spacing:.5px;margin-bottom:8px;
  }
  .roles{display:flex;gap:10px;margin-bottom:16px;}
  .role-card{
    flex:1;display:flex;align-items:center;gap:10px;
    padding:14px;border-radius:14px;background:#fff;
    border:1px solid var(--outline);cursor:pointer;
  }
  .role-card.selected{
    background:var(--primary-wash);border:2px solid var(--primary);padding:13px;
  }
  .role-card .role-ic{
    width:40px;height:40px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:var(--primary-soft);
  }
  .role-card .role-ic .material-icons{color:var(--primary);font-size:22px;}
  .role-card.selected .role-ic{background:var(--primary);}
  .role-card.selected .role-ic .material-icons{color:#fff;}
  .role-card .role-text{flex:1;min-width:0;}
  .role-card .role-text .t{font-size:14px;font-weight:600;color:var(--text);}
  .role-card.selected .role-text .t{color:var(--primary-dark);}
  .role-card .role-text .s{font-size:11px;color:var(--text-2);}
  .role-card .check{color:var(--primary);font-size:20px;}

  /* Field */
  .field{display:block;margin-bottom:14px;}
  .field-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500;}
  .field-box{
    display:flex;align-items:center;gap:10px;height:56px;
    border:1.5px solid var(--outline);border-radius:14px;background:#fff;padding:0 14px;
  }
  .field-box:focus-within{border-color:var(--primary);}
  .field-icon{color:var(--text-2);font-size:20px;}
  .field-box input{flex:1;border:0;outline:0;font:400 15px 'Roboto',sans-serif;color:var(--text);background:transparent;}
  .field-help{font-size:11px;color:var(--text-2);margin-top:4px;padding:0 4px;}

  /* Checkbox */
  .terms{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
  .check-box{
    width:18px;height:18px;border-radius:4px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .check-box .material-icons{color:#fff;font-size:14px;}
  .terms .t{font-size:14px;color:var(--text-2);}
  .terms .link{
    border:0;background:transparent;padding:0;cursor:pointer;
    color:var(--primary);font:600 14px 'Roboto',sans-serif;
    text-decoration:none;
  }

  /* Botones */
  .btn-primary{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;height:56px;border-radius:28px;border:0;cursor:pointer;
    background:var(--primary);color:#fff;font:600 14px/1 'Roboto',sans-serif;
    letter-spacing:.2px;box-shadow:0 6px 16px rgba(0,119,182,.3);margin-top:6px;
  }
  .btn-primary[disabled]{background:var(--outline);color:var(--text-3);box-shadow:none;}
  .login-row{display:flex;align-items:center;justify-content:center;margin-top:6px;}
  .login-row .t{font-size:14px;color:var(--text-2);}
  .btn-link{
    border:0;background:transparent;color:var(--primary);
    font:600 14px 'Roboto',sans-serif;padding:8px 12px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="device">
    <div class="screen">
      <!-- Status bar (Android) -->
      <div class="status">
        <span>9:41</span>
        <span class="right">
          <span class="material-icons">network_cell</span>
          <span class="material-icons">wifi</span>
          <span class="material-icons">battery_full</span>
        </span>
      </div>

      <!-- Top bar -->
      <div class="topbar">
        <button class="icon-btn"><span class="material-icons">arrow_back</span></button>
      </div>

      <!-- Contenido scrollable -->
      <div class="scroll">
        <div class="reg-head">
          <div class="avatar"><span class="material-icons">water_drop</span></div>
          <div>
            <h1>Crea tu cuenta</h1>
            <div class="sub">Tarda menos de un minuto</div>
          </div>
        </div>

        <!-- Selector rol -->
        <div class="section-label">QUIERO REGISTRARME COMO</div>
        <div class="roles">
          <div class="role-card selected">
            <div class="role-ic"><span class="material-icons">person</span></div>
            <div class="role-text">
              <div class="t">Cliente</div>
              <div class="s">Pedir agua</div>
            </div>
            <span class="material-icons check">check_circle</span>
          </div>
          <div class="role-card">
            <div class="role-ic"><span class="material-icons">local_shipping</span></div>
            <div class="role-text">
              <div class="t">Repartidor</div>
              <div class="s">Llevar agua</div>
            </div>
          </div>
        </div>

        <!-- Form base -->
        <label class="field">
          <span class="field-label">Nombre completo</span>
          <span class="field-box">
            <span class="material-icons field-icon">person</span>
            <input type="text" placeholder="Gael Márquez" />
          </span>
        </label>
        <label class="field">
          <span class="field-label">Correo electrónico</span>
          <span class="field-box">
            <span class="material-icons field-icon">alternate_email</span>
            <input type="email" placeholder="tu@correo.com" />
          </span>
        </label>
        <label class="field">
          <span class="field-label">Teléfono (10 dígitos)</span>
          <span class="field-box">
            <span class="material-icons field-icon">phone</span>
            <input type="tel" placeholder="55 1234 5678" />
          </span>
        </label>
        <label class="field">
          <span class="field-label">Contraseña</span>
          <span class="field-box">
            <span class="material-icons field-icon">lock</span>
            <input type="password" placeholder="••••••••" />
            <span class="material-icons field-icon">visibility_off</span>
          </span>
          <div class="field-help">Mínimo 8 caracteres</div>
        </label>
        <label class="field">
          <span class="field-label">Confirmar contraseña</span>
          <span class="field-box">
            <span class="material-icons field-icon">lock</span>
            <input type="password" placeholder="••••••••" />
            <span class="material-icons field-icon">visibility_off</span>
          </span>
        </label>

        <!-- Términos -->
        <div class="terms">
          <div class="check-box"><span class="material-icons">check</span></div>
          <div class="t">Acepto los Términos y el <button type="button" class="link" onclick="window.open('02b-aviso-privacidad.html', '_blank')">Aviso de Privacidad</button></div>
        </div>

        <button class="btn-primary">Regístrate</button>

        <div class="login-row">
          <span class="t">¿Ya tienes cuenta?</span>
          <button class="btn-link">Iniciar sesión</button>
        </div>
      </div>

    </div>
    <div class="nav-pill"></div>
  </div>
</body>
</html>
